name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libpipewire-0.3-dev \
            libxdo-dev

      - run: pnpm install --frozen-lockfile

      - name: Check versions are in sync across all 6 files
        run: pnpm check:versions

      - name: Typecheck (TypeScript)
        run: pnpm typecheck

      - name: Build all packages
        run: pnpm build

      - name: Check dist/ is in sync with sources
        run: |
          if ! git diff --exit-code packages/*/dist/; then
            echo "::error::dist/ is out of date. Run 'pnpm build' and commit the changes."
            exit 1
          fi

          UNTRACKED=$(git ls-files --others --exclude-standard -- 'packages/*/dist/')
          if [ -n "$UNTRACKED" ]; then
            echo "::error::New untracked dist files found after build:"
            echo "$UNTRACKED"
            echo "Run 'pnpm build && git add packages/*/dist/' and commit."
            exit 1
          fi

      - name: Cargo check (Rust)
        run: cargo check --quiet
